<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzApp - Ingreso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="card p-4 shadow border-0 bg-light" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark" style="margin: 0 0 5px 0;">Finanz<span class="text-primary">App</span></h2>
            <p class="text-secondary small" id="auth-title" style="margin: 0;">Ingresá a tu cuenta de finanzas</p>
        </div>

        <form id="auth-form">
            <div class="mb-3">
                <label for="auth-email" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" id="auth-email" class="form-control" required placeholder="tu@email.com">
            </div>
            <div class="mb-3">
                <label for="auth-password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="auth-password" class="form-control" required placeholder="Mínimo 6 caracteres">
            </div>
            
            <button type="submit" id="btn-auth-submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="border-radius: 6px;">Iniciar Sesión</button>
        </form>

        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 text-muted">
            <span class="mx-2 text-muted small fw-bold">O BIEN</span>
            <hr class="flex-grow-1 text-muted">
        </div>

        <button type="button" id="btn-google" class="btn btn-outline-danger w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2" style="border-radius: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
              <path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0c2.244 0 4.177.817 5.678 2.23l-2.583 2.583C10.045 3.793 9.142 3.34 8 3.34c-2.42 0-4.388 2.01-4.388 4.48S5.58 12.3 8 12.3c2.44 0 3.359-1.71 3.5-2.613H8.366V6.557h7.179z"/>
            </svg>
            Continuar con Google
        </button>

        <div class="text-center mt-4">
            <p class="small m-0 text-muted" id="toggle-text">
                <span id="text-explicativo">¿No tenés cuenta? </span><a href="#" id="link-toggle-auth" class="text-primary fw-semibold text-decoration-none">Registrate acá</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDKs estables -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script src="auth.js"></script>
</body>
</html>
