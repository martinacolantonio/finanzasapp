<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzApp - Mi Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-grid">
        
        <aside class="sidebar-panel">
            <div class="brand-zone">
                <h2>Finanz<span>App</span></h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link-item active">Panel Central</a>
                <a href="#" class="nav-link-item">Estadísticas</a>
                <a href="#" class="nav-link-item">Configuración</a>
            </nav>
        </aside>

        <main class="main-content-panel">
            <header class="dashboard-header mb-4">
                <h1>Control de Gastos</h1>
                <p class="text-secondary">Monitoreá tus ingresos y egresos en tiempo real.</p>
            </header>

            <section class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card p-3 border-0 bg-success-subtle">
                        <span class="text-success fw-bold text-uppercase small">Ingresos</span>
                        <h3 class="display-6 fw-semibold m-0" id="balance-ingresos">$0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 border-0 bg-danger-subtle">
                        <span class="text-danger fw-bold text-uppercase small">Gastos</span>
                        <h3 class="display-6 fw-semibold m-0" id="balance-gastos">$0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 border-0 bg-primary-subtle">
                        <span class="text-primary fw-bold text-uppercase small">Saldo Neto</span>
                        <h3 class="display-6 fw-semibold m-0" id="balance-neto">$0</h3>
                    </div>
                </div>
            </section>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card p-4 border-0 shadow-sm">
                        <h4 class="mb-3 fs-5">Agregar Operación</h4>
                        <form id="transaction-form">
                            <div class="mb-3">
                                <label for="concept" class="form-label">Concepto</label>
                                <input type="text" id="concept" class="form-control" placeholder="Ej: Sueldo" required>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Monto ($)</label>
                                <input type="number" id="amount" class="form-control" placeholder="Ej: 2500" required>
                            </div>
                            <div class="mb-3">
                                <label for="type" class="form-label">Tipo de movimiento</label>
                                <select id="type" class="form-select">
                                    <option value="ingreso">Ingreso (+)</option>
                                    <option value="gasto">Gasto (-)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-4 border-0 shadow-sm">
                        <h4 class="mb-3 fs-5">Historial de Movimientos</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle m-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Concepto</th>
                                        <th>Tipo</th>
                                        <th>Monto</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-list"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
