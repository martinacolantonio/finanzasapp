<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzApp - Panel Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: sans-serif;">

    <nav class="navbar navbar-dark bg-dark px-3 shadow">
        <span class="navbar-brand mb-0 h1 fw-bold">Finanz<span class="text-primary">App</span> <span class="badge bg-primary fs-6">Pro</span></span>
        <button id="btn-logout" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</button>
    </nav>

    <div class="container-fluid my-4">
        
        <!-- CONTROL DE PLANILLAS MÚLTIPLES -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card p-3 shadow-sm border-0 bg-white d-flex flex-md-row align-items-center justify-content-between gap-3" style="border-radius: 10px;">
                    <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 400px;">
                        <label for="select-planilla" class="fw-bold text-secondary text-nowrap m-0">Planilla Activa:</label>
                        <select id="select-planilla" class="form-select fw-bold text-primary"></select>
                    </div>
                    <div class="d-flex gap-2 w-100 w-md-auto">
                        <input type="text" id="nueva-planilla-nombre" class="form-control" placeholder="Ej: Gastos Fijos">
                        <button id="btn-crear-planilla" class="btn btn-success fw-bold text-nowrap">＋ Crear Planilla</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Formulario Izquierda -->
            <div class="col-12 col-md-4">
                <div class="card p-4 shadow-sm border-0 bg-white" style="border-radius: 10px;">
                    <h4 class="fw-bold mb-3 text-dark">Nuevo Movimiento</h4>
                    <form id="transaccion-form">
                        <div class="mb-3">
                            <label for="concept" class="form-label fw-semibold">Concepto</label>
                            <input type="text" id="concept" class="form-control" placeholder="Ej: Alquiler, Luz, Sueldo" required>
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label fw-semibold">Monto ($)</label>
                            <input type="number" id="amount" class="form-control" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label fw-semibold">Fecha</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="type" class="form-label fw-semibold">Tipo</label>
                            <select id="type" class="form-select">
                                <option value="gasto">Gasto (-)</option>
                                <option value="ingreso">Ingreso (+)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">Categoría Personalizada</label>
                            <input type="text" id="category" class="form-control" list="categorias-sugeridas" placeholder="Escribí una nueva o elegí de la lista" required>
                            <datalist id="categorias-sugeridas">
                                <option value="Vivienda">
                                <option value="Supermercado">
                                <option value="Servicios">
                                <option value="Salidas">
                                <option value="Mascotas">
                                <option value="Suscripciones">
                                <option value="Transporte">
                            </datalist>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Agregar Movimiento</button>
                    </form>
                </div>
            </div>

            <!-- Contenido Derecha -->
            <div class="col-12 col-md-8">
                
                <!-- Indicadores de Saldo -->
                <div class="row g-3 text-center mb-4">
                    <div class="col-4">
                        <div class="p-3 bg-white shadow-sm rounded-3 border-start border-success border-4">
                            <small class="text-muted fw-bold text-uppercase d-block">Ingresos</small>
                            <span id="balance-ingresos" class="fs-4 fw-bold text-success">$0</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-3 bg-white shadow-sm rounded-3 border-start border-danger border-4">
                            <small class="text-muted fw-bold text-uppercase d-block">Gastos</small>
                            <span id="balance-gastos" class="fs-4 fw-bold text-danger">$0</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-3 bg-white shadow-sm rounded-3 border-start border-primary border-4">
                            <small class="text-muted fw-bold text-uppercase d-block">Neto</small>
                            <span id="balance-neto" class="fs-4 fw-bold text-primary">$0</span>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Tabla de Historial -->
                    <div class="col-12 col-lg-7">
                        <div class="card p-3 shadow-sm border-0 bg-white" style="border-radius: 10px;">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold m-0" id="titulo-tabla-planilla">Historial</h5>
                                <button id="btn-vaciar" class="btn btn-outline-danger btn-sm fw-bold">Vaciar Planilla</button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle m-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Fecha</th>
                                            <th>Concepto</th>
                                            <th>Categoría</th>
                                            <th>Monto</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-cuerpo"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico Unificado Variado -->
                    <div class="col-12 col-lg-5">
                        <div class="card p-3 shadow-sm border-0 bg-white text-center" style="border-radius: 10px;">
                            <h5 class="fw-bold mb-1">Distribución Global</h5>
                            <small class="text-muted d-block mb-3">(Vincula todas tus planillas creadas)</small>
                            <div style="max-width: 250px; margin: 0 auto;">
                                <canvas id="graficoPizza"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase Compat CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="app.js"></script>
</body>
</html>
